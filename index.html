<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SUNIL SIMON</title>

    <style>
      #worksnowfall {
        position: fixed;
        inset: 0;
        top: 100px;
        left: calc(50% + 173px);
        /* background-color: rgb(70, 55, 131); */
        height: 400px;
      }

      .work-snow-item {
        position: absolute;
        top: -20px;
        opacity: 0;
        visibility: hidden;
      }

      @keyframes fall {
        from {
          top: -20px;
          opacity: 0;
        }
        20% {
          opacity: 1;
        }
        to {
          top: 400px;
          opacity: 1;
        }
      }

      #playsnowfall {
        position: fixed;
        inset: 0;
        top: 100px;
        width: calc(50% - 153px);
        height: 400px;
      }

      .play-snow-item {
        position: absolute;
        top: -20px;
        opacity: 0;
        visibility: hidden;
      }

      .work-text-container p {
        position: absolute;
        top: 100px;
        left: 50%;
        transform: translateX(calc(-100% - 133px - 10px));
        z-index: 1;
        opacity: 0;
      }

      .work-image-container {
        position: absolute;
        width: 133px;
        height: 400px;

        background-color: #c81919;
        border-radius: 20px 0 0 20px;

        overflow: hidden;

        left: 50%;
        top: 100px;
        transform: translateX(-133px);
animation: work-enter 1.2s ease-out forwards;
        transition:
          width 1.1s ease,
          left 1s ease;

        z-index: 2;
      }

      .work-image-container img {
        width: 236px;
        height: 400px;
        display: block;
        
      }

      .play-image-container {
        position: absolute;

        width: 169px;
        height: 400px;

        border-radius: 0 20px 20px 0;

        left: 50%;
        top: 100px;
        transform: translateX(2px);

        overflow: hidden;

        clip-path: inset(0 0 0 0);

        background-color: #4219c8;
        animation: play-enter 1.2s ease-out forwards;
        transition:
          width 1s ease,
          transform 1s ease,
          clip-path 1.5s ease,
          left 1s ease;

        z-index: 3;
      }

      .play-image-container img {
        width: 286px;
        height: 400px;

        display: block;
        margin-left: -117px;

        transition: margin-left 1s ease;
      }

      .play-text-container p {
        position: absolute;
        top: 100px;
        left: 50%;
        opacity: 0;
        transform: translateX(calc(169px + 10px));
        z-index: 4;
      }

      @keyframes work-enter {
        from {
          transform: translateX(calc(-100vw - 133px));
        }

        to {
          transform: translateX(-133px);
        }
      }

      @keyframes play-enter {
        from {
          transform: translateX(100vw);
        }

        to {
          transform: translateX(2px);
        }
      }

      .image-stack:has(.play-image-container:hover, #worksnowfall:hover)
        .work-image-container {
        width: 14px;
      }
      .image-stack:has(.play-image-container:hover, #worksnowfall:hover)
        .play-snow-item {
        visibility: visible;
        animation: fall 3s linear infinite;
      }
      .image-stack:has(.play-image-container:hover, #worksnowfall:hover)
        .play-image-container {
        width: 286px;
        left: calc(50% - 115px);
        /* transform: translateX(-115px); */
      }
      .image-stack:has(.play-image-container:hover, #worksnowfall:hover)
        .play-image-container
        img {

        margin-left: 0;
      }
      .image-stack:has(.play-image-container:hover, #worksnowfall:hover)
        .play-text-container
        p {
        opacity: 1;
      }

      .image-stack:has(.work-image-container:hover, #playsnowfall:hover)
        .work-snow-item {
        visibility: visible;
        animation: fall 3s linear infinite;
      }
      .image-stack:has(.work-image-container:hover, #playsnowfall:hover)
        .work-image-container {
        width: 233px;
      }
      .image-stack:has(.work-image-container:hover, #playsnowfall:hover)
        .play-image-container {
        clip-path: inset(0 0 0 61%);
      }
      .image-stack:has(.work-image-container:hover, #playsnowfall:hover)
        .work-text-container
        p {
        opacity: 1;
      }
    </style>
  </head>

  <body>
    <div class="image-stack">
      <!-- Snowfall layers -->
      <div id="worksnowfall"></div>
      <div id="playsnowfall"></div>

      <div class="work-text-container">
        <p>DEVELOPER</p>
      </div>

      <!-- Developer image -->
      <div class="work-image-container">
        <img src="Images/WorkImage.png" alt="My image" />
      </div>

      <!-- Cyclist image -->
      <div class="play-image-container">
        <img src="Images/PlayImage.png" alt="My image" />
      </div>

      <div class="play-text-container">
        <p>CYCLIST</p>
      </div>

      <!-- TypeScript -->
      <script type="module" src="dist/snowfall.js"></script>
    </div>
  </body>
</html>
