<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SUNIL SIMON</title>
    <style>
      .work-image-container {
        position: absolute;
        width: 133px;
        height: 400px;
        left: 140px;
        overflow: hidden;
        transition:
          width 1s ease,
          left 1s ease;

        z-index: 1;
      }

      .work-image-container img {
        width: 233px;
        height: 400px;
        display: block;
      }

      .work-image-container:hover {
        width: 233px;
      }

      /* PLAY */

      .play-image-container {
        position: absolute;

        width: 386px;
        height: 400px;

        left: 273.5px;
        overflow: hidden;
        clip-path: inset(0 0 0 0);
        transition:
          width 1s ease,
          transform 1s ease,
          clip-path 1s ease,
          left 1s ease;

        z-index: 2;
      }

      .play-image-container img {
        width: 286px;
        height: 400px;
        display: block;

        margin-left: -119px;
        transition: margin-left 1s ease;
      }

      .play-image-container:hover {
        width: 386px;
        left: 160px;
      }

      .play-image-container:hover img {
        margin-left: 0;
      }

      .image-stack:has(.work-image-container:hover) .play-image-container {
        clip-path: inset(0 0 0 80%);
      }

      .image-stack:has(.play-image-container:hover) .work-image-container {
        width: 0px;
      }
    </style>
  </head>
  <body>
    <div class="image-stack">
      <div class="work-image-container">
        <img src="Images/WorkImage.png" alt="My image" />
      </div>
      <div class="play-image-container">
        <img src="Images/PlayImage.png" alt="My image" />
      </div>
    </div>
  </body>
</html>
